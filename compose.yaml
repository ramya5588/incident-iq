services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidentiq
      POSTGRES_USER: incidentiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentiq_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - incidentiq-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U incidentiq -d incidentiq" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  incidentiq-data:

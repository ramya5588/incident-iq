services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidentiq
      POSTGRES_USER: incidentiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentiq_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - incidentiq-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U incidentiq -d incidentiq" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Catches every email the backend sends in development; nothing is
  # delivered. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  incidentiq-data:

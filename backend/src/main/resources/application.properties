spring.application.name=incident-iq

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incidentiq}
spring.datasource.username=${DB_USERNAME:incidentiq}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# AI triage provider: local or openai
incidentiq.ai.provider=${AI_PROVIDER:local}
incidentiq.ai.model=${OPENAI_MODEL:gpt-6-astra}
# SLA targets per priority (ISO-8601 or simple durations such as 15m, 4h, 3d).
# respond = time until someone first assigns it or moves it out of Open.
# resolve = time until it is resolved. Deadlines run around the clock.
# Existing incidents got deadlines from these defaults in migration V6.
incidentiq.sla.targets.CRITICAL.respond=15m
incidentiq.sla.targets.CRITICAL.resolve=4h
incidentiq.sla.targets.HIGH.respond=1h
incidentiq.sla.targets.HIGH.resolve=8h
incidentiq.sla.targets.MEDIUM.respond=4h
incidentiq.sla.targets.MEDIUM.resolve=24h
incidentiq.sla.targets.LOW.respond=8h
incidentiq.sla.targets.LOW.resolve=3d

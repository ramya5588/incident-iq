spring.application.name=incident-iq

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incidentiq}
spring.datasource.username=${DB_USERNAME:incidentiq}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# AI triage provider: local or openai
incidentiq.ai.provider=${AI_PROVIDER:local}
incidentiq.ai.model=${OPENAI_MODEL:gpt-6-astra}
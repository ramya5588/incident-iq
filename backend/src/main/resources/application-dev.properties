# Local development profile. Activate with SPRING_PROFILES_ACTIVE=dev
# (or -Dspring-boot.run.profiles=dev). Never use this profile in production.

# Accounts with no password get this one at startup so you can sign in.
# Accounts that already have a password are left alone.
incidentiq.auth.dev-default-password=incidentiq-dev

# On an empty database, a first admin is created with this email and the
# password above, so a fresh setup can sign in and add the team.
incidentiq.auth.dev-admin-email=admin@incidentiq.test

# Emails go to Mailpit (docker compose), readable at http://localhost:8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
incidentiq.mail.from=${MAIL_FROM:IncidentIQ <incidentiq@localhost>}

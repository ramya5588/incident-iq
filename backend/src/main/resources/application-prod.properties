# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod
# (compose.prod.yaml does this). Never combine with the dev profile.

# The app runs behind nginx, which sets X-Forwarded-* headers.
server.forward-headers-strategy=framework

# Session cookie: HttpOnly always; Secure unless you serve plain HTTP
# (set COOKIE_SECURE=false only for a local, non-HTTPS trial).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}

# Don't reveal internals: health shows only UP/DOWN, errors no details.
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never

# First admin on an empty database (see InitialAdminInitializer). Leave
# these empty once the team exists; they are ignored when any account exists.
incidentiq.bootstrap.admin-email=${INITIAL_ADMIN_EMAIL:}
incidentiq.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:}
incidentiq.bootstrap.admin-name=${INITIAL_ADMIN_NAME:Administrator}

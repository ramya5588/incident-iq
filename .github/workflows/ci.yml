name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch or PR when a newer one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts its own PostgreSQL using the runner's Docker.
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Catches a broken Dockerfile or nginx config; nothing is pushed.
      - name: Build backend image
        run: docker build --tag incidentiq-backend:ci backend

      - name: Build frontend image
        run: docker build --tag incidentiq-frontend:ci frontend

      - name: Check nginx config
        run: >
          docker run --rm --add-host backend:127.0.0.1
          incidentiq-frontend:ci nginx -t

      - name: Check compose file
        run: DB_PASSWORD=ci docker compose -f compose.prod.yaml config --quiet
